<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css" />
    </head>
    <body>
        <div class="header">

            <div class="loginterface">
                {% if session.user %}
                    <h2>Logged in as: <br> {{ session.user }}</h2>
                    <a href="/logout">Logout</a>
                    <a href="/manage">Manage account</a>
                {% else %}
                    <a href="/user">Login</a>
                {% endif %}

            </div>
            <a href="/" id="homeredir"><h1>donut stoppers</h1></a>

            <div class="cartdisplay">
                {% if cartline %}
                    <a href="/checkout"><h1>Cart({{cartline}})</h1></a>
                {%else%}
                    <a href="/checkout"><h1>Cart</h1></a>
                {%endif%}
                <a href="/history"><h1>Order History</h1></a>
            </div>

        </div>
        <h1>Welcome to donut stoppers</h1>
        <div class="linknav">
            <a href="/menu">Menu</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </div>
        {% block content %}{% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
