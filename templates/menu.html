<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="header">
            <h1>donut stoppers</h1>
            <h1>Welcome to donut stoppers</h1>
            <div class="linknav">
                <a href="/menu">Menu</a>
                <a href="/about">About</a>
                <a href="/contact">Contact</a>

            </div>
        </div>
        <h2>Menu</h2>
        <div class="menu">

            <div class="menu-items">
                <h2>plain donut</h2>
                <form action="/verify" method="post">
                    <input type="hidden" name="main_order" value="plain donut" id="main_order">
                    <input type="hidden" id="image" name="image" value="images/plain_donut.png">
                    <img src="{{ url_for('static', filename='images/plain_donut.png') }}" alt="Plain Donut" width="200">
                    <button type="submit">Add to Order</button>
                </form>
            </div>  
            <div class="menu-items">
                <h2>creme filled donut</h2>
                <form action="/verify" method="post">
                    <input type="hidden" name="main_order" value="creme filled donut" id="main_order">
                    <input type="hidden" id="image" name="image" value="images/creme-filled-donut.jpg">
                    <img src="{{ url_for('static', filename='images/creme-filled-donut.jpg') }}" alt="Creme Filled Donut" width="200">
                    <button type="submit">Add to Order</button>
                </form>
            </div>   
            <div class="menu-items">
                <h2>baked donut</h2>
                <form action="/verify" method="post">
                    <input type="hidden" name="main_order" value="baked donut" id="main_order">
                    <input type="hidden" id="image" name="image" value="images/baked-donut.jpg">
                    <img src="{{ url_for('static', filename='images/baked-donut.jpg') }}" alt="Baked Donut" width="200">
                    <button type="submit">Add to Order</button>
                </form>
            </div>             
        </div>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </body>
</html>
